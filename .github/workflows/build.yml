name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test release changelog verification
        run: bash .github/scripts/test-verify-release-changelog.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            25

      - name: Get frmjdapi.jar
        run: |
          curl '${{ secrets.FRMJDAPI_URL }}' -o libs/frmjdapi.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Assemble
        run: ./gradlew jreleaserAssemble

  sonar:
    name: SonarQube analysis
    permissions:
      contents: read
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            25

      - name: Get frmjdapi.jar
        run: |
          curl '${{ secrets.FRMJDAPI_URL }}' -o libs/frmjdapi.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # The tests need the Oracle Forms native libraries, which the runner lacks: the analysis has no coverage.
      - name: Prepare SonarQube analysis inputs
        run: ./gradlew testClasses

      - name: Run SonarQube Scanner
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
